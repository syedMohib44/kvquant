[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvquant-plus-plus"
version = "0.1.2"
description = "Attention-aware KV cache quantization for LLM inference (KVQuant++ extensions)"
readme = "PAPER.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
cuda = [
    "triton>=2.1.0; sys_platform != 'win32'",
    "triton-windows>=3.1.0; sys_platform == 'win32'",
    "cuda-triton-kernels @ git+https://github.com/syedMohib44/cuda-triton-multiarch.git",
]

[tool.setuptools]
packages = ["kvquant", "kvquant.csrc"]

[tool.setuptools.package-dir]
"kvquant" = "src"
"kvquant.csrc" = "src/csrc"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
