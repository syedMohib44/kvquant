[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvquant-plus-plus"
version = "0.1.15"
description = "Attention-aware KV cache quantization for LLM inference (KVQuant++ extensions)"
readme = "PAPER.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    # GPU kernels — Triton JIT softmax, flash attention, matmul, multi-GPU dispatcher.
    # Pre-built WMMA/CUTLASS CUDA extensions are included in the wheel when installed
    # from PyPI (built via GitHub Actions CI for all supported GPUs SM75-SM120).
    "cuda-triton-multiarch>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
cuda = [
    # cuda-triton-multiarch is already in base deps (Triton installed transitively).
    # This extra explicitly pins Triton for users who want a version-locked install.
    "triton>=2.1.0; sys_platform != 'win32'",
    "triton-windows>=3.1.0; sys_platform == 'win32'",
]
quant = [
    # Weight-placement offload for large models on low-VRAM GPUs, selected via
    # generate(..., weights="4bit"|"8bit"|"offload").
    #   4bit/8bit -> bitsandbytes on-GPU quantization (a 7B fits in ~5 GB / ~8 GB)
    #   offload   -> accelerate tiered GPU -> CPU RAM -> SSD placement
    "bitsandbytes>=0.43.0",
    "accelerate>=0.26.0",
]

[tool.setuptools]
packages = ["kvquant", "kvquant.csrc"]

[tool.setuptools.package-dir]
"kvquant" = "src"
"kvquant.csrc" = "src/csrc"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "cuda: requires a CUDA device (skipped otherwise)",
]
