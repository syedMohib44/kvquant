[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvquant-plus-plus"
version = "0.1.1"
description = "Attention-aware KV cache quantization for LLM inference (KVQuant++ extensions)"
readme = "PAPER.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
cuda = [
    "triton>=2.1.0",
]

[tool.setuptools]
packages = ["kvquant"]

[tool.setuptools.package-dir]
"kvquant" = "src"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
